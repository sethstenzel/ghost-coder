[project]
name = "ghost-coder"
version = "0.4.0"
description = "Automated code playback tool for creating coding tutorials and demo videos with hotkey-driven controls."
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Seth Stenzel", email = "seth.c.stenzel@gmail.com"}
]
keywords = ["coding", "tutorial", "demo", "playback", "automation", "video"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Documentation",
    "Topic :: Multimedia :: Video",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "amqtt>=0.11.3",
    "inputs>=0.5",
    "loguru>=0.7.3",
    "nicegui>=3.3.1",
    "paho-mqtt>=2.1.0",
    "pynput>=1.8.1",
    "pywebview>=6.1",
]

[project.scripts]
ghost-coder = "ghost_coder.app:main"

[project.urls]
Homepage = "https://github.com/sethstenzel/ghost-coder"
Repository = "https://github.com/sethstenzel/ghost-coder"
Issues = "https://github.com/sethstenzel/ghost-coder/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghost_coder"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.deptry.per_rule_ignores]
DEP002 = ["pywebview"]  # used by NiceGUI native mode

[dependency-groups]
dev = [
    "deptry>=0.24.0",
    "pytest>=8.0",
]
build = [
    "nuitka>=2.7",
    "ordered-set>=4.1",
    "zstandard>=0.23",
]
